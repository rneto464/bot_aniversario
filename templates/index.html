<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aniversários do Instituto</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Phosphor Icons for elegant icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo-icon">
                <i class="ph-fill ph-cake"></i>
            </div>
            <div class="header-titles">
                <h1>Aniversários do Instituto</h1>
                <p>Envie mensagens carinhosas no momento certo</p>
            </div>
            <div class="header-actions">
                <button id="btn-logs" class="btn btn-secondary" title="Logs do Bot">
                    <i class="ph ph-terminal-window"></i> Logs
                </button>
            </div>
        </header>

        <div class="divider"></div>

        <!-- Controls -->
        <div class="controls">
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Buscar colaborador...">
            </div>
            <div class="action-buttons">
                <button id="btn-config" class="btn btn-secondary">
                    <i class="ph ph-gear"></i> Configurações
                </button>
                <button id="btn-add" class="btn btn-primary">
                    <i class="ph ph-plus"></i> Adicionar
                </button>
            </div>
        </div>

        <!-- Calendário -->
        <section class="card calendar-section">
            <div class="calendar-header">
                <h2 id="calendar-month-title">Calendário</h2>
                <div class="calendar-nav">
                    <button id="cal-prev" class="btn-icon"><i class="ph ph-caret-left"></i></button>
                    <button id="cal-next" class="btn-icon"><i class="ph ph-caret-right"></i></button>
                </div>
            </div>
            <div class="calendar-grid-header">
                <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
            </div>
            <div id="calendar-grid" class="calendar-grid">
                <!-- Days will be generated by JS -->
            </div>
        </section>

        <!-- Próximos 30 dias -->
        <section class="card">
            <h2>Próximos 30 dias</h2>
            <div id="upcoming-list" class="list-container">
                <div class="empty-state">Carregando...</div>
            </div>
        </section>

        <!-- Todos os colaboradores -->
        <section class="card">
            <h2>Todos os colaboradores (<span id="total-count">0</span>)</h2>
            <div id="all-list" class="list-container">
                <div class="empty-state">Carregando...</div>
            </div>
        </section>
    </div>

    <!-- Modals -->

    <!-- Modal Adicionar -->
    <div id="modal-add" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Adicionar Colaborador</h2>
                <button class="close-modal"><i class="ph ph-x"></i></button>
            </div>
            <form id="form-add">
                <div class="form-group">
                    <label>Nome do Colaborador</label>
                    <input type="text" id="add-nome" required>
                </div>
                <div class="form-group">
                    <label>Data de Nascimento</label>
                    <input type="date" id="add-data" required>
                </div>
                <div class="form-group">
                    <label>E-mail (Opcional)</label>
                    <input type="email" id="add-email">
                </div>
                <div class="form-group">
                    <label>Telefone (Opcional)</label>
                    <input type="text" id="add-telefone" placeholder="Ex: (98) 90000-0000">
                </div>
                <div class="form-group">
                    <label>Foto do Colaborador (Opcional)</label>
                    <input type="file" id="add-foto" accept="image/png, image/jpeg">
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Configurações -->
    <div id="modal-config" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Configurações do Bot</h2>
                <button class="close-modal"><i class="ph ph-x"></i></button>
            </div>
            <form id="form-config">
                <div class="form-group">
                    <label>Mensagem Padrão (use {nome} para o nome)</label>
                    <textarea id="config-msg" rows="4"></textarea>
                </div>
                <div class="form-group">
                    <label>Grupos do WhatsApp (um ID ou código por linha)</label>
                    <textarea id="config-zap" rows="3" placeholder="Cole um ID ou código de convite por linha&#10;Ex:&#10;ABC123convite&#10;120363XXXXXX@g.us"></textarea>
                </div>
                <div class="form-group-row">
                    <div class="form-group w-50">
                        <label>Servidor SMTP</label>
                        <input type="text" id="config-smtp">
                    </div>
                    <div class="form-group w-50">
                        <label>Porta SMTP</label>
                        <input type="number" id="config-port">
                    </div>
                </div>
                <div class="form-group-row">
                    <div class="form-group w-50">
                        <label>Email de Envio</label>
                        <input type="text" id="config-user">
                    </div>
                    <div class="form-group w-50">
                        <label>Senha (Senha de App)</label>
                        <input type="password" id="config-pass">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Salvar Configurações</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Logs -->
    <div id="modal-logs" class="modal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2>Logs do Bot</h2>
                <button class="close-modal"><i class="ph ph-x"></i></button>
            </div>
            <div class="logs-container" id="logs-output">
                <!-- Logs will be appended here -->
            </div>
            <div class="modal-footer" style="justify-content: space-between;">
                <button type="button" id="btn-force-run" class="btn btn-secondary" style="border-color: #28a745; color: #28a745;">
                    <i class="ph ph-play"></i> Rodar Verificação Agora
                </button>
                <button type="button" class="btn btn-secondary close-modal-btn">Fechar</button>
            </div>
        </div>
    </div>

    <!-- Hidden Input for Image Upload -->
    <input type="file" id="hidden-file-input" accept="image/png, image/jpeg" style="display: none;">

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
